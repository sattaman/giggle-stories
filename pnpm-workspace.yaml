packages:
  - "packages/*"

# Build-script approvals (pnpm 11 blocks them by default).
# @google/genai: no-op preinstall + repo-only prepare. protobufjs: optional postinstall.
allowBuilds:
  "@google/genai": false
  protobufjs: false
  esbuild: true
  better-sqlite3: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - '@expo/ui@57.0.20'
  - babel-preset-expo@57.0.13
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo-router@57.0.23
  - expo@57.0.25

