packages:
  - "packages/*"
  - "spikes/*"

# Build-script approvals (pnpm 11 blocks them by default).
# @google/genai: no-op preinstall + repo-only prepare. protobufjs: optional postinstall.
allowBuilds:
  "@google/genai": false
  protobufjs: false
  esbuild: true

patchedDependencies:
  '@langchain/core@1.2.12': patches/@langchain__core@1.2.12.patch
  langsmith@0.10.5: patches/langsmith@0.10.5.patch
