<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <style>
    * {
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #biscuit {
      transform-box: fill-box;
      transform-origin: center;
      animation: tremble 2.8s ease-in-out infinite;
    }

    #chef-hat {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: hat-bob 2.2s ease-in-out infinite;
    }

    #blink-lids {
      animation: blink 4.2s infinite;
    }

    #spoon-glint {
      animation: glimmer 2.6s ease-in-out infinite;
    }

    #sun-oven {
      animation: sun-shimmer 3.4s ease-in-out infinite;
    }

    @keyframes tremble {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(1px, 0); }
      50% { transform: translate(-1px, 1px); }
      75% { transform: translate(1px, -1px); }
    }

    @keyframes hat-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes blink {
      0%, 89%, 94%, 100% { opacity: 0; }
      91%, 92% { opacity: 1; }
    }

    @keyframes glimmer {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.9; }
    }

    @keyframes sun-shimmer {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>

  <!-- Warm kitchen backdrop -->
  <rect width="800" height="600" fill="#fff3d9"/>
  <ellipse cx="400" cy="520" rx="330" ry="35" fill="#ead8b8"/>

  <!-- Shoebox back wall and side flaps -->
  <path d="M112 116 L76 151 L76 459 L112 429 Z"
        fill="#c99662" stroke="#80583b" stroke-width="7"/>
  <path d="M688 116 L724 151 L724 459 L688 429 Z"
        fill="#c99662" stroke="#80583b" stroke-width="7"/>
  <path d="M112 116 Q112 105 126 105 L674 105 Q688 105 688 116 L688 429 L112 429 Z"
        fill="#ead0a5" stroke="#80583b" stroke-width="7"/>

  <!-- The oven: a patch of sunshine -->
  <g id="sun-oven">
    <rect x="478" y="139" width="166" height="190" rx="20" fill="#ffd96b"/>
    <path d="M478 297 L644 297 L684 413 L440 413 Z" fill="#ffd96b" opacity="0.37"/>
    <circle cx="560" cy="223" r="35" fill="#ffb84f"/>
    <g stroke="#f49a3f" stroke-width="6">
      <path d="M560 174 V163"/>
      <path d="M560 283 V272"/>
      <path d="M511 223 H500"/>
      <path d="M620 223 H609"/>
      <path d="M526 189 L518 181"/>
      <path d="M602 265 L594 257"/>
      <path d="M594 189 L602 181"/>
      <path d="M518 265 L526 257"/>
    </g>
    <circle cx="560" cy="223" r="17" fill="#ffe99a"/>
  </g>

  <!-- Shoebox floor -->
  <path d="M112 404 L688 404 L740 501 L60 501 Z"
        fill="#d7a66e" stroke="#80583b" stroke-width="7"/>
  <path d="M112 405 L688 405" fill="none" stroke="#b77f4f" stroke-width="5"/>
  <path d="M60 488 Q400 510 740 488 L724 540 Q400 564 76 540 Z"
        fill="#c8915c" stroke="#80583b" stroke-width="7"/>
  <path d="M106 518 Q400 538 694 518" fill="none" stroke="#e2b47e" stroke-width="5"/>
  <path d="M157 523 L157 541 M216 526 L216 544 M276 529 L276 547
           M524 529 L524 547 M584 526 L584 544 M643 523 L643 541"
        fill="none" stroke="#a97248" stroke-width="3"/>

  <!-- Soft ground shadows -->
  <ellipse cx="365" cy="479" rx="103" ry="17" fill="#9d6842" opacity="0.22"/>
  <ellipse cx="591" cy="463" rx="42" ry="10" fill="#9d6842" opacity="0.23"/>

  <!-- The long, shiny rival spoon -->
  <g id="spoon">
    <path d="M566 318
             C575 329 585 340 591 353
             L624 441
             Q628 454 618 458
             Q607 462 603 449
             L573 361
             C568 346 565 333 562 322 Z"
          fill="#b8c9d2" stroke="#586d79" stroke-width="7"/>
    <path d="M587 355 L613 437"
          fill="none" stroke="#edf8fa" stroke-width="6" opacity="0.9"/>
    <ellipse cx="563" cy="269" rx="53" ry="72"
             fill="#bdcdd4" stroke="#586d79" stroke-width="7"/>
    <ellipse cx="563" cy="269" rx="43" ry="61"
             fill="#e2edf0" stroke="#93a9b2" stroke-width="3"/>

    <!-- Biscuit's worried face reflected in the spoon -->
    <g opacity="0.82">
      <circle cx="540" cy="242" r="11" fill="#f0bd78"/>
      <circle cx="586" cy="242" r="11" fill="#f0bd78"/>
      <ellipse cx="563" cy="268" rx="29" ry="37"
               fill="#f7d7a1" stroke="#c69a68" stroke-width="2"/>
      <path d="M548 258 Q553 254 558 258 M569 258 Q574 254 579 258"
            fill="none" stroke="#704d3c" stroke-width="3"/>
      <ellipse cx="554" cy="266" rx="3.5" ry="5" fill="#473c38"/>
      <ellipse cx="574" cy="266" rx="3.5" ry="5" fill="#473c38"/>
      <path d="M559 277 Q563 273 567 277" fill="none" stroke="#a86759" stroke-width="3"/>
      <ellipse cx="563" cy="288" rx="5" ry="7" fill="#855044"/>
      <path d="M548 250 Q554 246 559 250 M568 250 Q574 246 579 250"
            fill="none" stroke="#704d3c" stroke-width="3"/>
    </g>

    <g id="spoon-glint" fill="none" stroke="#ffffff" stroke-width="5">
      <path d="M532 221 Q540 207 551 204"/>
      <path d="M608 278 Q605 291 600 298"/>
    </g>
  </g>

  <!-- Biscuit, much too big for his hiding place -->
  <g id="biscuit">
    <!-- Body and fluffy outline -->
    <path d="M303 424
             Q291 404 307 391 Q309 369 332 367
             Q344 347 366 359 Q387 344 402 364
             Q430 363 434 388 Q451 403 435 423
             Q447 447 426 459 Q416 480 393 474
             Q374 490 357 474 Q334 484 323 466
             Q300 464 303 444 Q290 437 303 424 Z"
          fill="#e9a83f" stroke="#70482c" stroke-width="7"/>
    <ellipse cx="371" cy="433" rx="43" ry="31" fill="#f7d38f"/>

    <!-- Little feet -->
    <ellipse cx="337" cy="470" rx="22" ry="12" fill="#f2bd65" stroke="#70482c" stroke-width="5"/>
    <ellipse cx="404" cy="470" rx="22" ry="12" fill="#f2bd65" stroke="#70482c" stroke-width="5"/>

    <!-- Arms -->
    <path d="M319 402 Q301 413 292 433"
          fill="none" stroke="#70482c" stroke-width="20"/>
    <path d="M319 402 Q301 413 292 433"
          fill="none" stroke="#f0b653" stroke-width="12"/>
    <path d="M419 402 Q439 413 441 432"
          fill="none" stroke="#70482c" stroke-width="19"/>
    <path d="M419 402 Q439 413 441 432"
          fill="none" stroke="#f0b653" stroke-width="12"/>

    <!-- Ears behind the head -->
    <circle cx="319" cy="315" r="24" fill="#e9a83f" stroke="#70482c" stroke-width="6"/>
    <circle cx="319" cy="315" r="12" fill="#f4bb9e"/>
    <circle cx="412" cy="315" r="24" fill="#e9a83f" stroke="#70482c" stroke-width="6"/>
    <circle cx="412" cy="315" r="12" fill="#f4bb9e"/>

    <!-- Head -->
    <path d="M302 345
             Q302 311 328 301 Q345 286 367 296
             Q392 289 411 308 Q433 321 431 349
             Q432 379 408 393 Q385 408 358 399
             Q331 404 311 382 Q298 366 302 345 Z"
          fill="#f0b653" stroke="#70482c" stroke-width="7"/>

    <!-- Worried brows and eyes, looking toward the spoon -->
    <path d="M354 333 Q365 324 376 331 M388 331 Q400 323 411 332"
          fill="none" stroke="#70482c" stroke-width="5"/>
    <ellipse cx="367" cy="346" rx="8" ry="11" fill="#fffaf0"/>
    <ellipse cx="400" cy="346" rx="8" ry="11" fill="#fffaf0"/>
    <ellipse cx="371" cy="347" rx="4" ry="6" fill="#392f2b"/>
    <ellipse cx="404" cy="347" rx="4" ry="6" fill="#392f2b"/>
    <g id="blink-lids" fill="#f0b653">
      <ellipse cx="367" cy="346" rx="9" ry="12"/>
      <ellipse cx="400" cy="346" rx="9" ry="12"/>
    </g>
    <ellipse cx="420" cy="360" rx="5" ry="4" fill="#70482c"/>
    <path d="M414 372 Q420 367 426 372" fill="none" stroke="#70482c" stroke-width="4"/>
    <ellipse cx="391" cy="369" rx="10" ry="6" fill="#f6c994" opacity="0.8"/>
    <circle cx="408" cy="366" r="2" fill="#8b603e"/>
    <circle cx="415" cy="368" r="2" fill="#8b603e"/>

    <!-- Tiny white chef hat -->
    <g id="chef-hat">
      <path d="M338 298
               Q333 285 345 279
               Q344 262 360 259
               Q370 243 386 258
               Q403 258 402 278
               Q415 286 404 299 Z"
            fill="#fffdf6" stroke="#70482c" stroke-width="6"/>
      <path d="M337 295 Q370 302 406 295 L404 307 Q371 313 339 306 Z"
            fill="#fffdf6" stroke="#70482c" stroke-width="5"/>
      <path d="M355 273 Q362 266 370 270 M382 269 Q390 269 394 278"
            fill="none" stroke="#e5e0d7" stroke-width="3"/>
    </g>
  </g>

  <!-- The comically tiny hiding place -->
  <g id="raisin">
    <path d="M278 446
             Q278 428 293 425
             Q309 429 309 447
             Q309 467 295 477
             Q280 471 278 446 Z"
          fill="#613650" stroke="#42263d" stroke-width="5"/>
    <path d="M286 435 Q291 431 296 434" fill="none" stroke="#98708a" stroke-width="4"/>
    <path d="M286 455 Q289 461 288 465" fill="none" stroke="#472b43" stroke-width="3"/>
  </g>

  <!-- Biscuit clings bravely to the raisin -->
  <g id="brave-paw">
    <path d="M300 431 Q309 430 311 439 Q312 446 304 449 Q297 447 296 440 Z"
          fill="#f0b653" stroke="#70482c" stroke-width="4"/>
    <path d="M302 435 Q306 434 307 438" fill="none" stroke="#ffe0a3" stroke-width="2"/>
  </g>
</svg>