<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tremble {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: tremble 2.4s ease-in-out infinite;
    }
    .hat-bob {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: hatBob 2.1s ease-in-out infinite;
    }
    .spoon-glint {
      animation: glint 2.8s ease-in-out infinite;
    }
    .oven-glow {
      animation: glow 3.2s ease-in-out infinite;
    }
    .blink-lids {
      animation: blink 4.6s ease-in-out infinite;
    }

    @keyframes tremble {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-1deg) translateY(1px); }
      50% { transform: rotate(1deg) translateY(0); }
      75% { transform: rotate(-0.7deg) translateY(1px); }
    }
    @keyframes hatBob {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(3deg) translateY(-3px); }
    }
    @keyframes glint {
      0%, 25%, 100% { opacity: 0.15; transform: translateX(0); }
      55% { opacity: 0.9; transform: translateX(10px); }
      75% { opacity: 0.2; transform: translateX(14px); }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 43%, 47%, 100% { opacity: 0; }
      45% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>

  <!-- Cozy shoebox-sized kitchen -->
  <rect width="800" height="600" fill="#FFF3D7"/>
  <path d="M77 94 Q77 78 94 78 H706 Q723 78 723 95 V458 H77 Z"
        fill="#EBC38B" stroke="#70472D" stroke-width="8" stroke-linejoin="round"/>
  <path d="M77 94 L126 119 H674 L723 94" fill="none"
        stroke="#C58E59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 119 V458 M674 119 V458" fill="none"
        stroke="#C58E59" stroke-width="6" stroke-linecap="round"/>
  <path d="M77 435 Q400 414 723 435 V489 H77 Z"
        fill="#D99D63" stroke="#70472D" stroke-width="8" stroke-linejoin="round"/>
  <path d="M98 459 Q400 443 701 459" fill="none"
        stroke="#F4C78F" stroke-width="5" stroke-linecap="round"/>

  <!-- Oven made from a patch of sunshine -->
  <g id="sunshine-oven">
    <g class="oven-glow">
      <path d="M135 172 Q135 154 153 154 H279 Q297 154 297 172 V316 H135 Z"
            fill="#FFD86A" stroke="#70472D" stroke-width="7" stroke-linejoin="round"/>
      <path d="M159 192 Q159 179 172 179 H260 Q273 179 273 192 V292 H159 Z"
            fill="#FFF2A3" stroke="#D9943D" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="216" cy="233" r="28" fill="#FFC84E"/>
      <path d="M216 190 V180 M216 286 V276 M173 233 H163 M269 233 H259
               M186 203 L179 196 M253 270 L246 263 M246 203 L253 196 M179 270 L186 263"
            fill="none" stroke="#F5A93E" stroke-width="5" stroke-linecap="round"/>
      <path d="M180 298 Q216 282 252 298" fill="none"
            stroke="#F5A93E" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- The long, shiny rival spoon -->
  <g id="spoon">
    <path d="M595 378 L626 263" fill="none" stroke="#70472D" stroke-width="24" stroke-linecap="round"/>
    <path d="M595 378 L626 263" fill="none" stroke="#B7D5D8" stroke-width="15" stroke-linecap="round"/>
    <path d="M594 374 L621 271" fill="none" stroke="#F8FFFF" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="642" cy="218" rx="45" ry="61" transform="rotate(13 642 218)"
             fill="#70472D"/>
    <ellipse cx="642" cy="216" rx="38" ry="53" transform="rotate(13 642 216)"
             fill="#C6E1E2" stroke="#F7FFFF" stroke-width="5"/>
    <path d="M620 179 Q635 166 651 177" fill="none"
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9"/>
    <!-- Biscuit's anxious face reflected in the spoon bowl -->
    <g id="spoon-reflection" transform="rotate(13 642 216)">
      <ellipse cx="632" cy="207" rx="3.8" ry="5.5" fill="#4B5960"/>
      <ellipse cx="652" cy="207" rx="3.8" ry="5.5" fill="#4B5960"/>
      <path d="M625 198 Q631 194 637 198 M647 198 Q653 194 659 198"
            fill="none" stroke="#4B5960" stroke-width="3" stroke-linecap="round"/>
      <path d="M638 227 Q643 223 648 228" fill="none"
            stroke="#4B5960" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="640" cy="216" rx="4" ry="3" fill="#F39A89"/>
    </g>
    <path class="spoon-glint" d="M658 172 Q669 184 670 198"
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Biscuit, much too big to hide -->
  <g id="biscuit" class="tremble">
    <!-- fluffy body -->
    <path d="M303 438
             Q286 410 300 381 Q287 354 309 333
             Q311 300 343 289 Q360 265 391 277
             Q416 257 443 278 Q477 270 492 300
             Q524 309 521 341 Q545 365 526 393
             Q540 424 514 448 Q490 476 448 467
             Q414 490 383 467 Q340 480 318 458 Z"
          fill="#E9A83F" stroke="#70472D" stroke-width="8" stroke-linejoin="round"/>
    <!-- ears -->
    <path d="M337 315 Q318 277 340 265 Q363 263 374 299 Z"
          fill="#E9A83F" stroke="#70472D" stroke-width="7" stroke-linejoin="round"/>
    <path d="M345 292 Q336 277 344 276 Q354 280 357 296 Z" fill="#F5B8A5"/>
    <path d="M458 300 Q466 263 490 268 Q507 279 491 314 Z"
          fill="#E9A83F" stroke="#70472D" stroke-width="7" stroke-linejoin="round"/>
    <path d="M477 294 Q481 279 490 281 Q495 289 486 300 Z" fill="#F5B8A5"/>

    <!-- face looking nervously at the spoon -->
    <ellipse cx="385" cy="347" rx="8" ry="11" fill="#493B35"/>
    <ellipse cx="435" cy="347" rx="8" ry="11" fill="#493B35"/>
    <path d="M372 331 Q381 324 390 331 M428 331 Q437 324 446 331"
          fill="none" stroke="#70472D" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="410" cy="374" rx="24" ry="18" fill="#FFF0D4"/>
    <ellipse cx="410" cy="370" rx="7" ry="5" fill="#C96F55"/>
    <path d="M401 388 Q410 382 419 388" fill="none"
          stroke="#70472D" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="367" cy="371" rx="11" ry="6" fill="#F49C86" opacity=".8"/>
    <ellipse cx="453" cy="371" rx="11" ry="6" fill="#F49C86" opacity=".8"/>

    <!-- blinking lids -->
    <g class="blink-lids" fill="#E9A83F">
      <ellipse cx="385" cy="347" rx="11" ry="12"/>
      <ellipse cx="435" cy="347" rx="11" ry="12"/>
    </g>

    <!-- paws clutching the tiny hiding place -->
    <path d="M337 416 Q317 424 322 445 Q328 458 348 448 L365 431 Z"
          fill="#F2BD65" stroke="#70472D" stroke-width="6" stroke-linejoin="round"/>
    <path d="M477 416 Q497 424 492 445 Q486 458 466 448 L449 431 Z"
          fill="#F2BD65" stroke="#70472D" stroke-width="6" stroke-linejoin="round"/>
    <path d="M329 443 Q336 446 342 441 M480 441 Q486 446 492 443"
          fill="none" stroke="#C88138" stroke-width="3" stroke-linecap="round"/>

    <!-- tiny proud chef hat -->
    <g id="chef-hat" class="hat-bob">
      <path d="M373 286 Q360 277 366 264 Q370 253 382 257
               Q382 240 397 239 Q412 239 415 257
               Q430 248 438 261 Q445 275 431 285 Z"
            fill="#FFFFFF" stroke="#70472D" stroke-width="6" stroke-linejoin="round"/>
      <path d="M371 285 H434 V298 H371 Z"
            fill="#F7F4E9" stroke="#70472D" stroke-width="6" stroke-linejoin="round"/>
      <path d="M382 265 Q389 259 396 263 M411 262 Q420 257 426 265"
            fill="none" stroke="#D9D4C8" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- The comically inadequate raisin shield -->
  <g id="raisin">
    <ellipse cx="407" cy="465" rx="28" ry="36"
             fill="#704064" stroke="#4A3046" stroke-width="6"/>
    <path d="M397 437 Q405 444 401 451 M418 477 Q413 486 417 492"
          fill="none" stroke="#A66A8B" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="394" cy="455" rx="4" ry="7" fill="#B987A2" opacity=".8"/>
  </g>

  <!-- Grounding shadows -->
  <ellipse cx="411" cy="475" rx="132" ry="18" fill="#805637" opacity=".18"/>
  <ellipse cx="611" cy="429" rx="37" ry="10" fill="#805637" opacity=".16"/>
</svg>