<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <style>
    * { stroke-linecap: round; stroke-linejoin: round; }
    .tremble { animation: tremble 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .hat-bob { animation: bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .glint { animation: glint 2.6s ease-in-out infinite; }
    .sun-shimmer { animation: shimmer 3.2s ease-in-out infinite; }
    @keyframes tremble {
      0%, 100% { transform: translateX(0) rotate(0); }
      35% { transform: translateX(-2px) rotate(-1deg); }
      70% { transform: translateX(2px) rotate(1deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-4px) rotate(3deg); }
    }
    @keyframes glint {
      0%, 20%, 100% { opacity: .15; transform: translateX(-5px); }
      50% { opacity: 1; transform: translateX(5px); }
    }
    @keyframes shimmer {
      0%, 100% { opacity: .72; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>

  <!-- Shoebox-sized kitchen -->
  <rect width="800" height="600" fill="#f9e9c9"/>
  <path d="M58 66 Q59 48 79 48 H721 Q741 48 742 68 V438 H58Z"
        fill="#f6dcae" stroke="#76513b" stroke-width="8"/>
  <path d="M58 438 H742 L777 502 H27Z" fill="#cf9860" stroke="#76513b" stroke-width="8"/>
  <path d="M58 438 L27 502 M742 438 L777 502" fill="none" stroke="#76513b" stroke-width="8"/>
  <path d="M80 79 H721" fill="none" stroke="#fff2d9" stroke-width="7" opacity=".8"/>
  <path d="M110 99 V415 M690 99 V415" fill="none" stroke="#e8c48e" stroke-width="4"/>

  <!-- Warm patch of sunshine, serving as the oven -->
  <g id="sunshine-oven">
    <path class="sun-shimmer" d="M104 246 Q128 201 167 235 Q208 205 233 249
      Q270 251 266 294 Q283 330 249 349 H108 Q77 327 98 298 Q78 269 104 246Z"
      fill="#ffd45f" opacity=".88"/>
    <path d="M123 288 Q174 260 237 289" fill="none" stroke="#fff1a6" stroke-width="7" opacity=".8"/>
    <path d="M140 318 Q180 300 222 319" fill="none" stroke="#f6ad43" stroke-width="5" opacity=".7"/>
    <path d="M91 376 H269" fill="none" stroke="#a87345" stroke-width="6"/>
  </g>

  <!-- Little kitchen shelf and jar -->
  <path d="M482 226 H680" fill="none" stroke="#956342" stroke-width="10"/>
  <path d="M510 221 V173 Q510 162 521 162 H552 Q563 162 563 173 V221Z"
        fill="#b8d8d0" stroke="#76513b" stroke-width="5"/>
  <path d="M516 180 H557" fill="none" stroke="#fff5d9" stroke-width="5"/>
  <path d="M584 211 Q594 194 605 211 M605 211 Q616 190 629 211"
        fill="none" stroke="#6d9a65" stroke-width="7"/>

  <!-- The long, shiny rival spoon -->
  <g id="spoon">
    <path d="M578 390 Q572 325 577 264" fill="none" stroke="#76513b" stroke-width="18"/>
    <path d="M578 390 Q572 325 577 264" fill="none" stroke="#c4d8d8" stroke-width="11"/>
    <path d="M577 273
      C535 257 523 222 540 188
      C555 157 600 151 624 178
      C651 208 630 250 577 273Z"
      fill="#dcebea" stroke="#76513b" stroke-width="7"/>
    <path d="M563 177 Q540 193 548 218" fill="none" stroke="#fff" stroke-width="8" opacity=".9"/>
    <path class="glint" d="M614 182 Q630 199 623 217" fill="none"
          stroke="#fff" stroke-width="7" opacity=".2"/>

    <!-- Biscuit's worried face reflected in the spoon -->
    <g id="spoon-reflection" transform="rotate(-9 581 211)">
      <ellipse cx="584" cy="212" rx="22" ry="16" fill="#d9a76d" opacity=".72"/>
      <path d="M568 208 Q570 194 580 201 M588 201 Q600 194 602 208"
            fill="none" stroke="#754b39" stroke-width="3"/>
      <circle cx="575" cy="211" r="2.5" fill="#51382f"/>
      <circle cx="594" cy="211" r="2.5" fill="#51382f"/>
      <ellipse cx="585" cy="220" rx="4" ry="5" fill="#f7eee0" stroke="#754b39" stroke-width="2"/>
    </g>
  </g>

  <!-- Biscuit: visible almost entirely, despite the tiny hiding place -->
  <g id="biscuit" class="tremble">
    <!-- little feet -->
    <ellipse cx="367" cy="464" rx="33" ry="15" fill="#d89342" stroke="#76513b" stroke-width="6"/>
    <ellipse cx="451" cy="464" rx="33" ry="15" fill="#d89342" stroke="#76513b" stroke-width="6"/>
    <!-- fluffy body -->
    <path d="M326 422
      Q301 405 313 381 Q293 359 316 339 Q311 312 340 302
      Q353 275 382 287 Q404 264 429 286
      Q458 274 474 301 Q507 304 506 333
      Q528 354 506 378 Q515 405 489 420
      Q468 448 441 437 Q412 454 389 438 Q355 453 326 422Z"
      fill="#efb64f" stroke="#76513b" stroke-width="7"/>
    <!-- cheek fluff -->
    <path d="M330 347 Q310 340 316 365 M488 346 Q510 344 505 366"
          fill="none" stroke="#d9953e" stroke-width="8"/>
    <!-- face -->
    <ellipse cx="408" cy="354" rx="62" ry="51" fill="#f6d18a" stroke="#76513b" stroke-width="5"/>
    <ellipse cx="386" cy="347" rx="5" ry="7" fill="#49352c"/>
    <ellipse cx="432" cy="347" rx="5" ry="7" fill="#49352c"/>
    <path d="M399 370 Q408 362 417 370 Q409 381 399 370Z" fill="#9b5b50"/>
    <path d="M384 386 Q407 393 432 384" fill="none" stroke="#76513b" stroke-width="4"/>
    <ellipse cx="366" cy="369" rx="11" ry="6" fill="#ed9f83" opacity=".8"/>
    <ellipse cx="450" cy="369" rx="11" ry="6" fill="#ed9f83" opacity=".8"/>
    <!-- arms reaching around the raisin -->
    <path d="M350 403 Q337 426 352 438" fill="none" stroke="#76513b" stroke-width="15"/>
    <path d="M350 403 Q337 426 352 438" fill="none" stroke="#efb64f" stroke-width="9"/>
    <path d="M467 404 Q480 425 465 439" fill="none" stroke="#76513b" stroke-width="15"/>
    <path d="M467 404 Q480 425 465 439" fill="none" stroke="#efb64f" stroke-width="9"/>

    <!-- tiny white chef hat -->
    <g id="chef-hat" class="hat-bob">
      <path d="M372 294 Q363 281 374 270 Q383 260 392 271
        Q399 250 414 259 Q429 263 427 278 Q444 273 449 289
        Q451 300 440 305 H379 Q368 303 372 294Z"
        fill="#fffdf6" stroke="#76513b" stroke-width="5"/>
      <path d="M376 301 H443 V313 Q409 321 376 313Z"
        fill="#fffdf6" stroke="#76513b" stroke-width="5"/>
      <path d="M388 307 Q409 312 431 307" fill="none" stroke="#d8d0c5" stroke-width="3"/>
    </g>
  </g>

  <!-- The absurdly small hiding place -->
  <g id="raisin">
    <ellipse cx="408" cy="447" rx="18" ry="24" fill="#68403e" stroke="#4c3430" stroke-width="5"/>
    <path d="M399 436 Q405 430 412 435 M401 450 Q407 456 414 449"
          fill="none" stroke="#9a6860" stroke-width="3"/>
    <path d="M401 423 Q405 417 410 420" fill="none" stroke="#4c3430" stroke-width="4"/>
  </g>

  <!-- Foreground counter lip -->
  <path d="M28 502 Q398 530 775 502 V546 Q403 573 28 546Z"
        fill="#e4b77b" stroke="#76513b" stroke-width="7"/>
  <path d="M69 524 Q158 535 242 529 M574 529 Q665 535 733 523"
        fill="none" stroke="#f5d4a0" stroke-width="5"/>
</svg>